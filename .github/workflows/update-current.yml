name: Update current.json

on:
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write

# Preserve an in-progress write; queue another run for this branch.
concurrency:
  group: dcc-current-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-current:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TARGET_BRANCH: ${{ github.ref_name }}

    steps:
      - name: Check out the target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Refresh branch and generate current.json
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin "$TARGET_BRANCH"
          python generate_current.py

      - name: Commit and push current.json
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- current.json
          if git diff --staged --quiet; then
            echo "No feed changes to commit."
            exit 0
          fi
          git commit -m "Update current.json"
          # Rebase over unrelated edits pushed while generation was running.
          # Conflicting feed edits stop the job instead of overwriting them.
          git pull --rebase origin "$TARGET_BRANCH"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
